# Builds and pushes the punjaber image to Docker Hub whenever a GitHub
# Release is published on this repo. To ship a new version:
#   1. Merge to main.
#   2. Draft a new Release on GitHub (Releases -> Draft a new release),
#      tag it (e.g. v1.2.0), target main, and publish it.
# That publish event triggers this workflow, which builds the image from the
# release's commit and pushes it to Docker Hub tagged with the release tag
# and "latest".
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME — Docker Hub username
#   DOCKERHUB_TOKEN    — a Docker Hub access token (Account Settings ->
#                        Security -> Access Tokens), NOT your account
#                        password. Scope it to "Read & Write" on the
#                        punjaber repository only.
#
# Optional repo variable (Settings -> Secrets and variables -> Actions ->
# Variables), if the namespace ever needs to differ from the default:
#   DOCKERHUB_NAMESPACE
#
# The Lightsail instance pulls whatever this publishes — see
# terraform/variables.tf, var.dockerhub_namespace and var.image_tag.
name: Publish Docker image

env:
  DEFAULT_NAMESPACE: valkvlabs

on:
  release:
    types: [published]
  # Allows re-running a publish manually from the Actions tab (e.g. to
  # rebuild "latest" without cutting a new release) — always builds off main.
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine image tag and namespace
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
          namespace="${{ vars.DOCKERHUB_NAMESPACE }}"
          echo "namespace=${namespace:-$DEFAULT_NAMESPACE}" >> "$GITHUB_OUTPUT"

      # The image bakes in the 323 native-speaker recordings, so a publish
      # that silently shipped without them would serve a synthesised course.
      # Cheap to assert here; expensive to notice in production.
      - name: Verify the recordings are present
        run: |
          count=$(ls data/recordings/*.webm 2>/dev/null | wc -l)
          echo "Found $count recordings."
          if [ "$count" -eq 0 ]; then
            echo "::error::No recordings in data/recordings — refusing to publish a silent image."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # linux/amd64 only: the deployment target is an x86_64 instance, and
          # adding arm64 roughly doubles build time for an image nothing pulls
          # on arm. Add it here if that ever changes.
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.namespace }}/punjaber:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.namespace }}/punjaber:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.namespace }}/punjaber:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.namespace }}/punjaber:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
